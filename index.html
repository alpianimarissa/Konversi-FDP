<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Interaktif 30 Soal FDP - Kelas 4 SD</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
        }
        .font-display {
            font-family: 'Fredoka', sans-serif;
        }
        /* Custom Vertical Fraction Display */
        .frac {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            padding: 0 4px;
            font-weight: bold;
            line-height: 1.1;
        }
        .frac .num {
            border-bottom: 2px solid currentColor;
            padding-bottom: 1px;
        }
        .frac .den {
            padding-top: 1px;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 pb-12">

    <!-- Header Section -->
    <header class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white shadow-lg mb-6">
        <div class="max-w-6xl mx-auto px-4 py-6 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3 text-center md:text-left">
                <div class="w-12 h-12 rounded-2xl bg-white/20 flex items-center justify-center text-2xl shadow-inner">
                    🧮
                </div>
                <div>
                    <h1 class="font-display text-2xl sm:text-3xl font-bold tracking-wide">Kuis Interaktif FDP</h1>
                    <p class="text-blue-100 text-xs sm:text-sm">Pecahan, Desimal, dan Persen • Kelas 4 SD (30 Soal)</p>
                </div>
            </div>
            
            <!-- Quick Stats Bar -->
            <div class="flex items-center space-x-4 bg-white/10 px-4 py-2.5 rounded-2xl backdrop-blur-md border border-white/20 text-xs sm:text-sm">
                <div class="text-center">
                    <span class="block text-blue-200 text-[10px] uppercase font-bold tracking-wider">Terjawab</span>
                    <span id="answered-count" class="font-bold text-lg text-white">0/30</span>
                </div>
                <div class="w-px h-8 bg-white/20"></div>
                <div class="text-center">
                    <span class="block text-blue-200 text-[10px] uppercase font-bold tracking-wider">Skor Sementara</span>
                    <span id="score-count" class="font-bold text-lg text-amber-300">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-6xl mx-auto px-4">
        
        <!-- Progress Bar Section -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 mb-6">
            <div class="flex items-center justify-between text-xs sm:text-sm font-semibold text-slate-600 mb-2">
                <span id="progress-text"><i class="fa-solid fa-list-check text-blue-500 mr-1.5"></i> Soal 1 dari 30</span>
                <span id="progress-percent" class="text-blue-600 font-bold">3% Selesai</span>

            <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-indigo-600 h-full rounded-full transition-all duration-300" style="width: 3.33%"></div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">

            <!-- Left Side: Main Question Card -->
            <div class="lg:col-span-3">
                <div id="quiz-container" class="bg-white rounded-3xl p-6 sm:p-8 shadow-md border border-slate-200/80 space-y-6">
                    <!-- Dynamic Question Content Will Be Injected Here -->
                </div>

                <!-- Final Result Screen (Hidden by default) -->
                <div id="result-container" class="hidden bg-white rounded-3xl p-8 shadow-xl border border-slate-200 text-center space-y-6">
                    <div class="w-24 h-24 mx-auto rounded-full bg-amber-100 text-amber-500 flex items-center justify-center text-5xl shadow-inner">
                        🏆
                    </div>
                    <div>
                        <div id="result-badge" class="inline-block px-4 py-1.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800 mb-2">
                            Pencapaian Kuis
                        </div>
                        <h2 class="font-display text-3xl font-bold text-slate-800">Hasil Kuis FDP Kamu!</h2>
                        <p id="result-message" class="text-slate-600 text-sm max-w-md mx-auto mt-2"></p>
                    </div>

                    <div class="grid grid-cols-2 gap-4 max-w-sm mx-auto">
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 text-center">
                            <span class="block text-xs font-bold text-slate-400 uppercase">Jawaban Benar</span>
                            <span id="result-correct" class="text-2xl font-bold text-emerald-600">0 / 30</span>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 text-center">
                            <span class="block text-xs font-bold text-slate-400 uppercase">Nilai Akhir</span>
                            <span id="result-score" class="text-2xl font-bold text-blue-600">0</span>
                        </div>
                    </div>

                    <div class="pt-4">
                        <button onclick="restartQuiz()" class="px-8 py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold rounded-2xl shadow-lg shadow-blue-500/30 transition transform hover:-translate-y-0.5 inline-flex items-center">
                            <i class="fa-solid fa-rotate-right mr-2"></i> Coba Kuis Lagi
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right Side: Navigation Numbers Grid Sidebar -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200/80 space-y-4">
                    <h3 class="font-display font-bold text-slate-800 text-base flex items-center justify-between">
                        <span><i class="fa-solid fa-grip mr-2 text-blue-500"></i> Navigasi Soal</span>
                        <span class="text-xs font-normal text-slate-400">1 - 30</span>
                    </h3>
                    
                    <div id="nav-grid" class="grid grid-cols-5 gap-2">
                        <!-- 30 Nav Buttons Generated via JS -->
                    </div>

                    <!-- Legend -->
                    <div class="pt-3 border-t border-slate-100 text-[11px] text-slate-500 space-y-1.5">
                        <div class="flex items-center"><span class="w-3 h-3 rounded bg-blue-600 mr-2"></span> Soal Aktif</div>
                        <div class="flex items-center"><span class="w-3 h-3 rounded bg-emerald-100 border border-emerald-400 mr-2"></span> Jawaban Benar</div>
                        <div class="flex items-center"><span class="w-3 h-3 rounded bg-rose-100 border border-rose-400 mr-2"></span> Jawaban Salah</div>
                        <div class="flex items-center"><span class="w-3 h-3 rounded bg-slate-100 border border-slate-200 mr-2"></span> Belum Dijawab</div>
                    </div>
                </div>
            </div>

        </div>
    </main>

                answer: 1, // B

            {

                ],
                answer: 2, // C
                explanation: `30% = <span class="frac"><span class="num">30</span><span class="den">100</span></span>.<br>Sederhanakan dengan membagi pembilang dan penyebut dengan 10: <span class="frac"><span class="num">30 ÷ 10</span><span class="den">100 ÷ 10</span></span> = <strong><span class="frac"><span class="num">3</span><span class="den">10</span></span></strong>.`
            },
            {
                id: 24,
                category: "Soal Cerita • Tes Ujian",
                question: `Dalam ujian matematika, Siti menjawab benar 18 dari 20 soal (<span class="frac text-blue-600"><span class="num">18</span><span class="den">20</span></span>). Berapa persentase nilai Siti?`,
                options: ["90%", "80%", "85%", "95%"],
                answer: 0, // A
                explanation: `<span class="frac"><span class="num">18</span><span class="den">20</span></span> × <span class="frac"><span class="num">5</span><span class="den">5</span></span> = <span class="frac"><span class="num">90</span><span class="den">100</span></span> = <strong>90%</strong>.`
            },
            {
                id: 25,
                category: "Soal Cerita • Volume Air",
                question: `Botol minum Budi terisi air sebanyak <span class="text-emerald-600 font-bold">0,65 liter</span>. Jika dinyatakan dalam pecahan biasa sederhana, nilainya adalah...`,
                options: [
                    `<span class="frac"><span class="num">65</span><span class="den">100</span></span>`,
                    `<span class="frac"><span class="num">13</span><span class="den">20</span></span>`,
                    `<span class="frac"><span class="num">6</span><span class="den">5</span></span>`,
                    `<span class="frac"><span class="num">13</span><span class="den">50</span></span>`
                ],
                answer: 1, // B
                explanation: `0,65 = <span class="frac"><span class="num">65</span><span class="den">100</span></span>.<br>Bagi atas dan bawah dengan 5: <span class="frac"><span class="num">65 ÷ 5</span><span class="den">100 ÷ 5</span></span> = <strong><span class="frac"><span class="num">13</span><span class="den">20</span></span></strong>.`
            },
            {
                id: 26,
                category: "Soal Cerita • Olahraga",
                question: `Dari 100 siswa kelas 4, sebanyak 35 siswa menyukai basket. Bentuk desimal dari proporsi siswa yang menyukai basket adalah...`,
                options: ["0,35", "0,035", "3,5", "35,0"],
                answer: 0, // A
                explanation: `35 siswa dari 100 = <span class="frac"><span class="num">35</span><span class="den">100</span></span> = <strong>0,35</strong>.`
            },
            {
                id: 27,
                category: "Soal Cerita • Panen Semangka",
                question: `Pak Doni menjual <span class="frac text-blue-600"><span class="num">1</span><span class="den">5</span></span> bagian hasil panennya ke pasar dan <span class="text-emerald-600 font-bold">0,4</span> bagian ke toko. Berapa TOTAL persen semangka yang dijual?`,
                options: ["50%", "70%", "60%", "80%"],
                answer: 2, // C
                explanation: `Ubah keduanya ke persen:<br>• <span class="frac"><span class="num">1</span><span class="den">5</span></span> = 20%<br>• 0,4 = 40%<br>Total = 20% + 40% = <strong>60%</strong>.`
            },
            {
                id: 28,
                category: "Identifikasi Kesetaraan Nilai",
                question: `Manakah pasangan FDP di bawah ini yang <strong>TIDAK SETARA</strong> (salah)?`,
                options: [
                    `<span class="frac"><span class="num">1</span><span class="den">2</span></span> = 50% = 0,5`,
                    `<span class="frac"><span class="num">2</span><span class="den">5</span></span> = 40% = 0,4`,
                    `<span class="frac"><span class="num">3</span><span class="den">4</span></span> = 75% = 0,75`,
                    `<span class="frac"><span class="num">1</span><span class="den">5</span></span> = 15% = 0,2`
                ],
                answer: 3, // D
                explanation: `Pilihan D salah karena <span class="frac"><span class="num">1</span><span class="den">5</span></span> sama dengan <strong>20%</strong>, bukan 15%.`
            },
            {
                id: 29,
                category: "Soal Cerita • Mengukur Pita",
                question: `Dini punya pita <span class="text-emerald-600 font-bold">0,8 meter</span>. Lani punya pita <span class="frac text-blue-600"><span class="num">3</span><span class="den">4</span></span> meter. Pernyataan yang benar adalah...`,
                options: [
                    "Pita Dini lebih panjang dari pita Lani",
                    "Pita Lani lebih panjang dari pita Dini",
                    "Pita Dini dan Lani sama panjang",
                    "Pita Lani dua kali pita Dini"
                ],
                answer: 0, // A
                explanation: `Ubah ke bentuk desimal:<br>• Pita Dini = 0,8 meter (0,80 m)<br>• Pita Lani = <span class="frac"><span class="num">3</span><span class="den">4</span></span> m = 0,75 meter<br>Karena 0,80 > 0,75, maka pita Dini lebih panjang.`
            },
            {
                id: 30,
                category: "Konversi Desimal ke Pecahan",
                question: `Bentuk pecahan paling sederhana dari desimal <span class="text-emerald-600 font-bold">0,4</span> adalah...`,
                options: [
                    `<span class="frac"><span class="num">4</span><span class="den">10</span></span>`,
                    `<span class="frac"><span class="num">1</span><span class="den">4</span></span>`,
                    `<span class="frac"><span class="num">2</span><span class="den">5</span></span>`,
                    `<span class="frac"><span class="num">4</span><span class="den">5</span></span>`
                ],
                answer: 2, // C
                explanation: `0,4 = <span class="frac"><span class="num">4</span><span class="den">10</span></span>.<br>Bagi pembilang dan penyebut dengan 2: <span class="frac"><span class="num">4 ÷ 2</span><span class="den">10 ÷ 2</span></span> = <strong><span class="frac"><span class="num">2</span><span class="den">5</span></span></strong>.`
            }
        ];

        // Quiz State Management
        let currentQuestionIdx = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let isAnswerSubmitted = new Array(quizData.length).fill(false);

        // DOM Elements
        let quizContainer, navGrid, progressBar, progressText, progressPercent, answeredCountEl, scoreCountEl, resultContainer;

        // Render Nav Grid Buttons
        function renderNavGrid() {
            if (!navGrid) return;
            navGrid.innerHTML = '';
            quizData.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.className = `py-1.5 rounded-xl text-xs font-bold transition-all border ${getNavBtnStyle(idx)}`;
                btn.textContent = idx + 1;
                btn.onclick = () => jumpToQuestion(idx);
                navGrid.appendChild(btn);
            });
        }

        function getNavBtnStyle(idx) {
            if (idx === currentQuestionIdx) {
                return 'bg-blue-600 text-white border-blue-600 shadow-md ring-2 ring-blue-300';
            }
            if (userAnswers[idx] !== null) {
                const isCorrect = userAnswers[idx] === quizData[idx].answer;
                return isCorrect 
                    ? 'bg-emerald-100 text-emerald-800 border-emerald-300' 
                    : 'bg-rose-100 text-rose-800 border-rose-300';
            }
            return 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100';
        }

        // Render Current Question
        function renderQuestion() {
            if (!quizContainer) return;
            
            const q = quizData[currentQuestionIdx];
            const answered = userAnswers[currentQuestionIdx];
            const hasSubmitted = isAnswerSubmitted[currentQuestionIdx];

            let optionsHTML = '';
            q.options.forEach((opt, optIdx) => {
                let btnStyle = 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-sky-50 hover:border-sky-300';
                let icon = `<span class="w-7 h-7 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center font-bold text-xs mr-3 shrink-0">${String.fromCharCode(65 + optIdx)}</span>`;
                
                if (hasSubmitted) {
                    if (optIdx === q.answer) {
                        btnStyle = 'bg-emerald-50 border-2 border-emerald-500 text-emerald-900 font-bold';
                        icon = `<span class="w-7 h-7 rounded-full bg-emerald-500 text-white flex items-center justify-center font-bold text-xs mr-3 shrink-0"><i class="fa-solid fa-check"></i></span>`;
                    } else if (optIdx === answered) {
                        btnStyle = 'bg-rose-50 border-2 border-rose-500 text-rose-900 font-bold';
                        icon = `<span class="w-7 h-7 rounded-full bg-rose-500 text-white flex items-center justify-center font-bold text-xs mr-3 shrink-0"><i class="fa-solid fa-xmark"></i></span>`;
                    } else {
                        btnStyle = 'bg-slate-50 border-slate-200 text-slate-400 opacity-60';
                    }
                } else if (answered === optIdx) {
                    btnStyle = 'bg-blue-50 border-2 border-blue-500 text-blue-900 font-bold';
                    icon = `<span class="w-7 h-7 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs mr-3 shrink-0">${String.fromCharCode(65 + optIdx)}</span>`;
                }

                optionsHTML += `
                    <button onclick="selectOption(${optIdx})" ${hasSubmitted ? 'disabled' : ''} class="w-full text-left p-4 rounded-2xl border transition-all flex items-center ${btnStyle}">
                        ${icon}
                        <span class="text-sm sm:text-base flex-1">${opt}</span>
                    </button>
                `;
            });

            let explanationHTML = '';
            if (hasSubmitted) {
                const isCorrect = answered === q.answer;
                explanationHTML = `
                    <div class="p-4 rounded-2xl ${isCorrect ? 'bg-emerald-50 border border-emerald-200 text-emerald-900' : 'bg-rose-50 border border-rose-200 text-rose-900'} space-y-2 text-xs sm:text-sm">
                        <div class="flex items-center font-bold ${isCorrect ? 'text-emerald-700' : 'text-rose-700'}">
                            <i class="fa-solid ${isCorrect ? 'fa-circle-check text-emerald-500' : 'fa-circle-xmark text-rose-500'} text-lg mr-2"></i>
                            ${isCorrect ? 'Jawabanmu Benar!' : 'Jawaban Kurang Tepat'}
                        </div>
                        <div class="pt-2 text-slate-700 leading-relaxed border-t border-slate-200/60">
                            <strong>Pembahasan Lengkap:</strong><br>${q.explanation}
                        </div>
                    </div>
                `;
            }

            quizContainer.innerHTML = `
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-blue-600 bg-blue-100 px-3 py-1 rounded-full">
                        <i class="fa-solid fa-tag mr-1"></i> ${q.category}
                    </span>
                    <span class="text-xs font-semibold text-slate-400">Nomor ${q.id} dari 30</span>
                </div>

                <h2 class="font-display text-lg sm:text-xl font-bold text-slate-800 leading-snug">
                    ${q.question}
                </h2>

                <div class="space-y-3">
                    ${optionsHTML}
                </div>

                ${explanationHTML}

                <!-- Action Controls -->
                <div class="flex flex-wrap items-center justify-between gap-3 pt-4 border-t border-slate-100">
                    <button onclick="prevQuestion()" ${currentQuestionIdx === 0 ? 'disabled class="opacity-40 cursor-not-allowed px-4 py-2.5 bg-slate-100 text-slate-400 rounded-xl text-xs font-bold"' : 'class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition flex items-center"'}>
                        <i class="fa-solid fa-arrow-left mr-1.5"></i> Sebelumnya
                    </button>

                    <div class="flex items-center space-x-2">
                        ${!hasSubmitted ? `
                            <button onclick="submitAnswer()" ${answered === null ? 'disabled class="opacity-50 cursor-not-allowed px-5 py-2.5 bg-blue-600 text-white rounded-xl text-xs font-bold"' : 'class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-md transition flex items-center"'}>
                                <i class="fa-solid fa-paper-plane mr-1.5"></i> Periksa Jawaban
                            </button>
                        ` : ''}

                        ${currentQuestionIdx < quizData.length - 1 ? `
                            <button onclick="nextQuestion()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-md transition flex items-center">
                                Berikutnya <i class="fa-solid fa-arrow-right ml-1.5"></i>
                            </button>
                        ` : `
                            <button onclick="finishQuiz()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md transition flex items-center">
                                <i class="fa-solid fa-flag-checkered mr-1.5"></i> Selesai & Lihat Hasil
                            </button>
                        `}
                    </div>
                </div>
            `;

            updateStats();
            renderNavGrid();
        }

        // Interactivity functions
        function selectOption(optIdx) {
            if (isAnswerSubmitted[currentQuestionIdx]) return;
            userAnswers[currentQuestionIdx] = optIdx;
            renderQuestion();
        }

        function submitAnswer() {
            if (userAnswers[currentQuestionIdx] === null) return;
            isAnswerSubmitted[currentQuestionIdx] = true;
            renderQuestion();
        }

        function nextQuestion() {
            if (currentQuestionIdx < quizData.length - 1) {
                currentQuestionIdx++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestionIdx > 0) {
                currentQuestionIdx--;
                renderQuestion();
            }
        }

        function jumpToQuestion(idx) {
            currentQuestionIdx = idx;
            renderQuestion();
        }

        function updateStats() {
            const answeredCount = userAnswers.filter(a => a !== null).length;
            const correctCount = userAnswers.filter((ans, i) => ans === quizData[i].answer).length;
            const pct = Math.round(((currentQuestionIdx + 1) / quizData.length) * 100);

            if (progressText) progressText.innerHTML = `<i class="fa-solid fa-list-check text-blue-500 mr-1.5"></i> Soal ${currentQuestionIdx + 1} dari ${quizData.length}`;
            if (progressPercent) progressPercent.textContent = `${pct}% Selesai`;
            if (progressBar) progressBar.style.width = `${pct}%`;

            if (answeredCountEl) answeredCountEl.textContent = `${answeredCount}/${quizData.length}`;
            if (scoreCountEl) scoreCountEl.textContent = Math.round((correctCount / quizData.length) * 100);
        }

        function finishQuiz() {
            const correctCount = userAnswers.filter((ans, i) => ans === quizData[i].answer).length;
            const score = Math.round((correctCount / quizData.length) * 100);

            quizContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');

            document.getElementById('result-correct').textContent = `${correctCount} / 30`;
            document.getElementById('result-score').textContent = score;

            const badgeEl = document.getElementById('result-badge');
            const msgEl = document.getElementById('result-message');

            if (score >= 90) {
                badgeEl.textContent = "🏆 Bintang Matematika Super (Sangat Luar Biasa!)";
                badgeEl.className = "inline-block px-4 py-1.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800";
                msgEl.textContent = "Hebat sekali! Kamu sudah menguasai seluruh konsep pecahan, desimal, dan persen dengan sangat sempurna!";
            } else if (score >= 70) {
                badgeEl.textContent = "🌟 Master FDP Muda (Bagus Sekali)";
                badgeEl.className = "inline-block px-4 py-1.5 rounded-full text-xs font-bold bg-blue-100 text-blue-800";
                msgEl.textContent = "Hasil yang sangat bagus! Kamu sudah memahami hampir seluruh trik konversi dan pembandingan FDP.";
            } else if (score >= 50) {
                badgeEl.textContent = "👍 Pejuang Matematika (Terus Berlatih)";
                badgeEl.className = "inline-block px-4 py-1.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800";
                msgEl.textContent = "Kerja bagus! Pelajari kembali beberapa soal yang belum tepat di modul pembahasan untuk memperkuat ingatanmu.";
            } else {
                badgeEl.textContent = "🌱 Pembelajar Semangat";
                badgeEl.className = "inline-block px-4 py-1.5 rounded-full text-xs font-bold bg-slate-100 text-slate-800";
                msgEl.textContent = "Jangan berkecil hati! Cobalah mengulangi modul rangkuman materi FDP dan ikuti kuis ini sekali lagi.";
            }
        }

        function restartQuiz() {
            currentQuestionIdx = 0;
            userAnswers = new Array(quizData.length).fill(null);
            isAnswerSubmitted = new Array(quizData.length).fill(false);
            resultContainer.classList.add('hidden');
            quizContainer.classList.remove('hidden');
            renderQuestion();
        }

        // Initialize App on DOM Content Loaded
        document.addEventListener('DOMContentLoaded', function() {
            quizContainer = document.getElementById('quiz-container');
            navGrid = document.getElementById('nav-grid');
            progressBar = document.getElementById('progress-bar');
            progressText = document.getElementById('progress-text');
            progressPercent = document.getElementById('progress-percent');
            answeredCountEl = document.getElementById('answered-count');
            scoreCountEl = document.getElementById('score-count');
            resultContainer = document.getElementById('result-container');

            renderQuestion();
        });
    </script>
</body>
</html>
